name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request replaces its older run; runs on main always finish (a half-finished deploy is worse than a slow one).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Known-vulnerable production dependencies fail the build (dev-only tooling is excluded; Dependabot covers it).
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      # Citation-accuracy gates (replays recorded API responses: offline, deterministic). Fails the build if a fabricated
      # reference gets verified, a retracted paper is missed, or a DOI we return does not resolve.
      - run: npm run eval
      - run: npm run build
      # Real Worker + local D1 + fake identity provider: sign-in (PKCE, replay, CSRF), library sync, export and account deletion.
      - run: npm run integration -w apps/api

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Apply D1 migrations
        run: npm run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npm run deploy -w apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The deploy only counts if the live service answers and reports a migrated database (health returns 503 otherwise).
      - name: Verify production health
        run: curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors https://scholar.shodhsetu.workers.dev/api/v1/health
