name: Eval (live APIs)

# Weekly drift check: runs the citation-accuracy eval against the REAL OpenAlex / Semantic Scholar / Crossref / PubMed
# APIs (no recordings), so a changed API or a degraded data source is noticed within a week instead of by a user.
# The per-push CI gate replays recordings and cannot see upstream changes. Costs about $0.15 of OpenAlex credit per run.
on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run eval:live -w apps/api
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}

  # Opens (or updates) one issue per workflow when a job above fails, so a failure reaches you by e-mail instead of waiting to be noticed, and
  # closes it when the workflow passes again. Not for pull requests or other branches. See .github/scripts/workflow-alert.mjs.
  alert:
    needs: [live]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - run: node .github/scripts/workflow-alert.mjs auto
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
