name: Browser e2e

# Real-browser checks (Playwright + axe accessibility scan + CSP violations) against a local Worker. Slower and dependent on live search APIs for the smoke test, so it runs on pull
# requests that change what the browser gets (apps/web, or packages/shared, which the page bundles: decision 12 of docs/design/untangle.md), weekly, and on demand; not on every push.
on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/shared/**"
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces its older run.
concurrency:
  group: browser-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    # The run took 17 minutes on 2 Nov 2026 with the old chat suite (70 s on the runner); the chat suite is now about 430 checks, 3 to 4 minutes, and every suite runs one after another, so 20 was no longer enough.
    timeout-minutes: 35
    env:
      E2E_BROWSER: chrome # preinstalled on GitHub's Ubuntu runners; playwright-core does not download browsers
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      S2_API_KEY: ${{ secrets.S2_API_KEY }}
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run build
      - run: npm run integration -w apps/api -- --browser
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-shots
          path: apps/web/e2e/shots
          if-no-files-found: ignore
          retention-days: 14

  alert:
    needs: [e2e]
    if: always()
    uses: ./.github/workflows/alert.yml
    permissions:
      contents: read
      issues: write
    with:
      needs: ${{ toJSON(needs) }}
