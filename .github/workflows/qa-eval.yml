name: Q&A quality (real models)

# Weekly: asks the 35 gold questions (5 open-access papers, one Hindi question each) through the real upload -> index -> ask -> verify
# path with the REAL embedding and language models, and fails if answers get worse (answerable >= 85% correct, unanswerable >= 90%
# declined, sources verified). The per-push CI uses stand-in models and cannot see a changed model or prompt.
# The same job then asks twelve searches of the prompt box (live sources, real model) and fails if answers are not real: a sentence shown as evidence
# that is not in its abstract, a mark that is not a checked citation, a retracted paper cited, an answer to nonsense, or fewer than 75% answered.
# Then it gives the support judge 238 claims that a person labelled (supported or not, with the abstracts they cite) and fails if it misses more than 15% of the unsupported ones, calls more than 10% of them supported, drops more than 10% of the supported ones, or a call takes longer than 15 s at the 90th percentile.
# Then it asks the router of Auto mode about 200 labelled messages in English, Hindi and Hinglish (no search is run) and fails if it picks the wrong tool more than 10% of the time
# (more than 15% in Hindi or Hinglish), does not translate a Hindi search, or follows an order hidden in a message. That step uses roughly a day's free Workers AI allowance.
# Then it asks eight real papers (Europe PMC XML, arXiv PDFs, one closed paper that must fall back to its abstract), 15 questions in English, Hinglish and Hindi, through "Ask this paper"
# (real sources, real embeddings, real model) and fails if a paper that should be readable is not, an answer has no verified quote, a known fact is missing, or a control is invented.
# Needs repository secrets CLOUDFLARE_API_TOKEN (Workers AI) and CLOUDFLARE_ACCOUNT_ID. Uses a few thousand free Workers AI neurons.
# The papers are public arXiv preprints, downloaded at run time (their text is not committed).
on:
  schedule:
    - cron: "0 4 * * 2" # Tuesdays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - run: pip install pypdf fonttools
      - run: npm run build -w apps/web # the Worker serves the built web app, and refuses to start without it

      - name: Fetch the five gold-set papers and extract their text
        run: |
          mkdir -p qa-papers
          node -e '
            const q = require("./apps/api/scripts/r2/questions.json").papers;
            for (const [name, p] of Object.entries(q)) console.log(name, p.arxiv);
          ' | while read name id; do
            curl -sSL --retry 3 -o "qa-papers/$name.pdf" "https://arxiv.org/pdf/$id"
            python -I -X utf8 apps/api/scripts/r2/pdf2txt.py "qa-papers/$name.pdf" "qa-papers/$name.txt"
          done
          ls -la qa-papers

      - name: Start the Worker (real Workers AI, fake sign-in)
        working-directory: apps/api
        run: |
          npx wrangler d1 migrations apply scholar-db --local
          nohup npx wrangler dev --port 8788 --var GOOGLE_CLIENT_ID:dev --var GOOGLE_CLIENT_SECRET:dev-secret --var DEV_IDP_URL:http://localhost:9911 --var ENABLE_DEV_ROUTES:1 --var ORCID_CLIENT_ID:dev --var ORCID_CLIENT_SECRET:dev-secret > ../../worker.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8788/api/v1/health >/dev/null && exit 0; sleep 3; done
          cat ../../worker.log; exit 1

      - name: Ask the gold questions
        shell: bash # with pipefail, so a failed run is not hidden by tee
        run: |
          set -o pipefail
          node apps/api/scripts/qa-eval.mjs qa-papers --gate | tee qa-eval.txt

      - name: Ask the search questions of the prompt box (live search, real model)
        shell: bash
        run: |
          set -o pipefail
          node apps/api/scripts/chat-eval.mjs --gate | tee chat-eval.txt

      - name: Ask the support judge (238 hand-labelled claims, real model, no search)
        shell: bash
        run: |
          set -o pipefail
          node apps/api/scripts/support-eval.mjs --split=all --gate | tee support-eval.txt

      - name: Ask the router of Auto mode (English, Hindi, Hinglish; real model, no search)
        shell: bash
        run: |
          set -o pipefail
          node apps/api/scripts/router-eval.mjs --set=all --gate | tee router-eval.txt

      - name: Ask real open-access papers (Europe PMC, arXiv, real model)
        shell: bash
        run: |
          set -o pipefail
          node apps/api/scripts/oa-eval.mjs --gate | tee oa-eval.txt

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-eval
          path: |
            qa-eval.txt
            chat-eval.txt
            support-eval.txt
            router-eval.txt
            oa-eval.txt
            worker.log
            apps/api/scripts/r2/results/

  # Opens (or updates) one issue per workflow when a job above fails, so a failure reaches you by e-mail instead of waiting to be noticed, and
  # closes it when the workflow passes again. Not for pull requests or other branches. See .github/scripts/workflow-alert.mjs.
  alert:
    needs: [qa]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - run: node .github/scripts/workflow-alert.mjs auto
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
