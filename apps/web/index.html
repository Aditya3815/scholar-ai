<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Research assistant for scholars: verified citations, paper Q&A, reference checks." />
    <title>Scholar</title>
    <script>
      // Flash-free theme: pehli paint se pehle theme set karo.
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t === "light" || t === "dark" || t === "read") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
